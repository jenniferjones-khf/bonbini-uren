<!DOCTYPE html>
<html lang="nl" data-stijl="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Locaties — Bon Bini</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* ============ drie stijlen, dezelfde pagina ============ */
  :root{
    --display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
    --body:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --ja:#1F8A54; --ja-b:rgba(31,138,84,.12);
    --mis:#B07A0B; --mis-b:rgba(176,122,11,.14);
    --nee:#B3382F; --nee-b:rgba(179,56,47,.12);
  }
  /* A - contactvel: papier, fijne lijnen, zakelijk en dicht op elkaar */
  [data-stijl="a"]{
    --grond:#EFEFEC; --vlak:#FFFFFF; --vlak2:#F6F6F3; --lijn:#DBDBD4; --lijn2:#C8C8C0;
    --tekst:#191A18; --zacht:#6C6E68; --zacht2:#93958D; --accent:#191A18; --accentTekst:#FFFFFF;
    --kopFont:var(--body); --kopGewicht:700; --kopMaat:clamp(30px,4vw,44px); --kopKleur:#191A18;
    --kopTransform:none; --kopSpatie:-.02em; --schaduw:0 1px 2px rgba(0,0,0,.04);
    --radius:8px; --duim:96px;
  }
  /* B - nacht: donker, goud, de foto's springen eruit */
  [data-stijl="b"]{
    --grond:#0B0C0F; --vlak:#14161B; --vlak2:#191C22; --lijn:#252932; --lijn2:#333846;
    --tekst:#EDEAE4; --zacht:#8D93A0; --zacht2:#5F6572; --accent:#F2B41E; --accentTekst:#231A05;
    --kopFont:var(--display); --kopGewicht:800; --kopMaat:clamp(38px,6vw,66px); --kopKleur:#F2B41E;
    --kopTransform:uppercase; --kopSpatie:-.04em; --schaduw:none;
    --radius:14px; --duim:104px;
    --ja:#4FBF85; --ja-b:rgba(79,191,133,.16);
    --mis:#E5B23F; --mis-b:rgba(229,178,63,.16);
    --nee:#E0655A; --nee-b:rgba(224,101,90,.16);
  }
  /* C - poster: warm karton met het goud en rood van de reeks */
  [data-stijl="c"]{
    --grond:#F3EADA; --vlak:#FFFBF3; --vlak2:#F7EFE1; --lijn:#DFCFB4; --lijn2:#C9B695;
    --tekst:#231A0E; --zacht:#7A6851; --zacht2:#A08D73; --accent:#D8342C; --accentTekst:#FFFBF3;
    --kopFont:var(--display); --kopGewicht:800; --kopMaat:clamp(38px,6vw,68px); --kopKleur:#D8342C;
    --kopTransform:uppercase; --kopSpatie:-.035em; --schaduw:0 2px 0 rgba(201,182,149,.5);
    --radius:12px; --duim:100px;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--grond);color:var(--tekst);font:15px/1.5 var(--body);padding-bottom:70px;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1320px;margin:0 auto;padding:0 22px}
  a{color:inherit}

  header{border-bottom:1px solid var(--lijn);padding:34px 0 22px;background:var(--vlak)}
  [data-stijl="b"] header{background:var(--grond)}
  .oog{font:500 10.5px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--zacht2);margin:0 0 12px}
  h1{font-family:var(--kopFont);font-weight:var(--kopGewicht);font-size:var(--kopMaat);line-height:.98;
    letter-spacing:var(--kopSpatie);text-transform:var(--kopTransform);color:var(--kopKleur);margin:0}
  .doel{color:var(--zacht);font-size:14.5px;margin:12px 0 0;max-width:70ch}
  .doel b{color:var(--tekst);font-weight:600}
  .telling{display:flex;gap:30px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--lijn)}
  .telling b{font-family:var(--kopFont);font-weight:var(--kopGewicht);font-size:24px;line-height:1;
    font-variant-numeric:tabular-nums;display:block}
  .telling span{font:400 10px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--zacht2);
    display:block;margin-top:6px}

  .balk{position:sticky;top:0;z-index:20;background:var(--grond);border-bottom:1px solid var(--lijn)}
  .balk .wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 22px}
  .pillen{display:flex;gap:2px;background:var(--vlak);border:1px solid var(--lijn);border-radius:999px;padding:3px}
  .pil{border:0;background:none;border-radius:999px;padding:6px 13px;cursor:pointer;color:var(--zacht);
    font:500 12.5px var(--body);white-space:nowrap}
  .pil.aan{background:var(--accent);color:var(--accentTekst)}
  .ikben{margin-left:auto;display:flex;gap:6px;align-items:center;font:400 10px var(--mono);
    letter-spacing:.12em;text-transform:uppercase;color:var(--zacht2)}
  .ikben input{border:1px solid var(--lijn);border-radius:999px;padding:7px 12px;background:var(--vlak);
    color:var(--tekst);font:400 12.5px var(--body);width:124px;text-transform:none;letter-spacing:0}
  .ikben input:focus{outline:0;border-color:var(--accent)}
  .stijlkiezer{font:400 10px var(--mono);letter-spacing:.1em;color:var(--zacht2);display:flex;gap:6px;align-items:center}
  .stijlkiezer a{padding:4px 8px;border:1px solid var(--lijn);border-radius:6px;text-decoration:none}
  .stijlkiezer a.aan{background:var(--accent);color:var(--accentTekst);border-color:var(--accent)}

  main{padding-top:22px}
  .sectie{font:500 10.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--zacht2);
    margin:26px 0 12px;display:flex;align-items:center;gap:12px}
  .sectie:first-child{margin-top:0}
  .sectie::after{content:"";flex:1;height:1px;background:var(--lijn)}

  .groep{border:1px solid var(--lijn);border-radius:var(--radius);background:var(--vlak);margin-bottom:10px;
    overflow:hidden;box-shadow:var(--schaduw)}
  .groep>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center;
    flex-wrap:wrap}
  .groep>summary::-webkit-details-marker{display:none}
  .groep>summary:hover{background:var(--vlak2)}
  .groep>summary .pijl{width:9px;height:9px;border-right:2px solid var(--zacht2);border-bottom:2px solid var(--zacht2);
    transform:rotate(-45deg);transition:transform .15s;flex:0 0 auto;margin-right:2px}
  .groep[open]>summary{border-bottom:1px solid var(--lijn);background:var(--vlak2)}
  .groep[open]>summary .pijl{transform:rotate(45deg)}
  .groep>summary h2{font-family:var(--kopFont);font-weight:var(--kopGewicht);font-size:17px;margin:0;
    letter-spacing:-.01em}
  .groep>summary .aantal{font:400 11.5px var(--mono);color:var(--zacht2)}
  .groepinhoud{padding:10px 10px 4px}
  .planregel{margin:2px 6px 14px;font:400 11.5px var(--mono);color:var(--zacht2);line-height:1.7}
  .planregel b{color:var(--tekst);font-weight:600}
  .planregel i{font-style:normal;color:var(--zacht2);opacity:.75;margin-left:8px}
  .dagrij{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:7px}
  .dagnaam.nogniet{color:var(--mis)}
  td.subset{padding-left:30px}
  .dagnaam{min-width:104px;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;
    color:var(--zacht)}
  .sc{position:relative;display:inline-block;padding:2px 7px;border:1px solid var(--lijn2);
    border-radius:5px;background:var(--vlak2);color:var(--tekst);font:500 11px var(--mono);cursor:help}
  .sc:hover{background:var(--accent);color:var(--accentTekst);border-color:var(--accent)}
  .sc:hover::after{content:attr(data-tip);position:absolute;left:0;bottom:calc(100% + 8px);z-index:40;
    width:max-content;max-width:340px;white-space:pre-line;text-align:left;padding:9px 12px;
    border-radius:8px;background:#14161B;color:#EDEAE4;border:1px solid #333846;
    font:400 12px/1.5 var(--body);letter-spacing:0;box-shadow:0 8px 24px rgba(0,0,0,.28);pointer-events:none}
  .sc:hover::before{content:"";position:absolute;left:14px;bottom:calc(100% + 3px);z-index:41;
    border:5px solid transparent;border-top-color:#333846;pointer-events:none}
  table.planning{min-width:900px}
  td.scnr{font:600 12.5px var(--mono);white-space:nowrap}
  .groepinhoud .vel{margin-bottom:10px}
  .groepinhoud .vel:last-child{margin-bottom:6px}

  .vel{background:var(--vlak);border:1px solid var(--lijn);border-radius:var(--radius);margin-bottom:14px;
    box-shadow:var(--schaduw);overflow:hidden}
  .velkop{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding:14px 16px 10px}
  .velkop h2{font-family:var(--kopFont);font-weight:var(--kopGewicht);font-size:18px;margin:0;letter-spacing:-.01em}
  .merk{font:500 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;
    border-radius:999px;border:1px solid var(--lijn2);color:var(--zacht)}
  .telstrook{margin-left:auto;display:flex;gap:6px;font:500 10px var(--mono);letter-spacing:.06em}
  .telstrook span{padding:5px 9px;border-radius:999px;border:1px solid var(--lijn)}
  .telstrook .j{color:var(--ja);background:var(--ja-b);border-color:transparent}
  .telstrook .t{color:var(--mis);background:var(--mis-b);border-color:transparent}
  .telstrook .n{color:var(--nee);background:var(--nee-b);border-color:transparent}

  .velmeta{padding:0 16px 12px;display:flex;flex-direction:column;gap:5px}
  .voor{font:400 11.5px var(--mono);color:var(--zacht2);margin:0;line-height:1.6}
  .voor b{color:var(--zacht);font-weight:400}
  .tekst{margin:0;font-size:14px;color:var(--zacht);line-height:1.55;max-width:80ch}
  .extern{align-self:flex-start;margin-top:4px;font:600 12px var(--body);background:var(--accent);
    color:var(--accentTekst);text-decoration:none;padding:7px 13px;border-radius:999px}

  .vel-fotos{display:grid;gap:3px;grid-template-columns:repeat(auto-fill,minmax(var(--duim),1fr));
    padding:0 16px 14px}
  .vel-fotos img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--vlak2);cursor:zoom-in;
    display:block;border-radius:3px;transition:opacity .15s}
  .vel-fotos img:hover{opacity:.82}
  .geenfoto{padding:0 16px 14px;font:400 12px var(--mono);color:var(--zacht2);letter-spacing:.06em}

  .oordeel{border-top:1px solid var(--lijn);background:var(--vlak2);padding:12px 16px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .keuzes{display:flex;gap:6px}
  .keuze{border:1px solid var(--lijn2);background:var(--vlak);color:var(--zacht);border-radius:999px;
    padding:8px 14px;font:600 12.5px var(--body);cursor:pointer;white-space:nowrap}
  .keuze:hover{border-color:var(--zacht2)}
  .keuze[data-w="Langs gaan"].aan{background:var(--ja);border-color:var(--ja);color:#fff}
  .keuze[data-w="Twijfel"].aan{background:var(--mis);border-color:var(--mis);color:#fff}
  .keuze[data-w="Niet nodig"].aan{background:var(--nee);border-color:var(--nee);color:#fff}
  .oordeel textarea{flex:1;min-width:200px;border:1px solid var(--lijn);border-radius:10px;padding:9px 12px;
    background:var(--vlak);color:var(--tekst);font:400 13.5px var(--body);resize:vertical;min-height:40px}
  .oordeel textarea:focus{outline:0;border-color:var(--accent)}
  .bewaar{background:var(--accent);color:var(--accentTekst);border:0;border-radius:999px;padding:9px 16px;
    font:600 12.5px var(--body);cursor:pointer}
  .bewaar:disabled{opacity:.45}

  .gezegd{padding:10px 16px 14px;display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--lijn)}
  .zei{background:var(--vlak2);border:1px solid var(--lijn);border-radius:999px;padding:6px 12px;font-size:13px;
    color:var(--zacht);max-width:100%}
  .zei b{color:var(--tekst);font-weight:600}
  .zei i{font-style:normal;font-weight:600}
  .zei i.j{color:var(--ja)} .zei i.t{color:var(--mis)} .zei i.n{color:var(--nee)}

  .tabelwrap{overflow-x:auto;border:1px solid var(--lijn);border-radius:var(--radius);background:var(--vlak)}
  table{width:100%;border-collapse:collapse;min-width:820px}
  th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--lijn);font-size:13.5px;vertical-align:top}
  th{font:500 9.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--zacht2);
    background:var(--vlak2)}
  tr:last-child td{border-bottom:0}
  td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
  td.stil{color:var(--zacht2)}
  .groepkop td{background:var(--vlak2);font-family:var(--kopFont);font-weight:var(--kopGewicht);font-size:13.5px}

  .melding{background:var(--vlak);border:1px solid var(--accent);color:var(--tekst);border-radius:10px;
    padding:11px 16px;margin-bottom:14px;font-size:13.5px}
  .laden{color:var(--zacht2);font:400 12px var(--mono);letter-spacing:.1em;padding:34px 0;text-transform:uppercase}

  dialog{border:0;border-radius:10px;padding:0;background:#000;max-width:96vw;max-height:96vh}
  dialog::backdrop{background:rgba(0,0,0,.86)}
  dialog img{max-width:96vw;max-height:90vh;display:block}
  dialog form{position:absolute;top:10px;right:10px}
  dialog button{background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:999px;
    padding:7px 14px;cursor:pointer;font:500 12px var(--body)}

  @media (max-width:720px){
    .wrap{padding:0 14px}
    .ikben{margin-left:0;width:100%}
    .ikben input{flex:1;width:auto}
    .telstrook{margin-left:0;width:100%}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <p class="oog">Bon Bini 6 &middot; Jetzt Geht's Los</p>
    <h1>Locaties</h1>
    <p class="doel">Scoutfoto's van mogelijke locaties. We kijken hier met het hele team naar om te bepalen <b>of een artistiek locatiebezoek nodig is</b>. Sommige panden worden nog volledig door art verbouwd, andere niet. Zeg per locatie of we langs moeten.</p>
    <div class="telling" id="telling"></div>
  </div>
</header>

<div class="balk">
  <div class="wrap">
    <div class="pillen">
      <button class="pil aan" data-tab="kandidaten">Scoutfoto's</button>
      <button class="pil" data-tab="decors">Locatielijst uit het script</button>
      <button class="pil" data-tab="planning">Draaiplanning</button>
    </div>
    <div class="pillen">
      <button class="pil aan" data-blok="alles">Alles</button>
      <button class="pil" data-blok="Nederland">Nederland</button>
      <button class="pil" data-blok="Oostenrijk">Oostenrijk</button>
    </div>
    <span class="ikben">
      Ik ben <input id="wie" placeholder="je naam" autocomplete="name">
      <input id="afdeling" placeholder="afdeling">
    </span>
  </div>
</div>

<main class="wrap">
  <div id="melding"></div>
  <div id="inhoud" class="laden">Bezig met laden&hellip;</div>
</main>

<dialog id="groot"><form method="dialog"><button>Sluiten</button></form><img alt=""></dialog>

<script>
const params = new URLSearchParams(location.search);
const code = params.get("k") || "";
const api = (q) => "/api/locaties?k=" + encodeURIComponent(code) + "&" + q;
let data = null, tab = "kandidaten", blok = "alles";
const fotocache = {};

const gekozenStijl = (params.get("stijl") || "a").toLowerCase();
document.documentElement.dataset.stijl = ["a", "b", "c"].indexOf(gekozenStijl) > -1 ? gekozenStijl : "a";

const wieVeld = document.getElementById("wie");
const afdVeld = document.getElementById("afdeling");
try {
  wieVeld.value = localStorage.getItem("bb_wie") || "";
  afdVeld.value = localStorage.getItem("bb_afdeling") || "";
} catch (e) {}
wieVeld.addEventListener("input", () => { try { localStorage.setItem("bb_wie", wieVeld.value); } catch (e) {} });
afdVeld.addEventListener("input", () => { try { localStorage.setItem("bb_afdeling", afdVeld.value); } catch (e) {} });

document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => {
  tab = b.dataset.tab;
  document.querySelectorAll("[data-tab]").forEach((x) => x.classList.toggle("aan", x === b));
  teken();
}));
document.querySelectorAll("[data-blok]").forEach((b) => b.addEventListener("click", () => {
  blok = b.dataset.blok;
  document.querySelectorAll("[data-blok]").forEach((x) => x.classList.toggle("aan", x === b));
  teken();
}));

const ontsnap = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function haal() {
  try {
    const r = await fetch(api("actie=lijst"));
    const d = await r.json();
    if (d.fout) throw new Error(d.fout);
    data = d;
    telling();
    teken();
  } catch (e) {
    document.getElementById("inhoud").innerHTML =
      '<div class="melding">Kan de locaties niet ophalen: ' + ontsnap(e.message) + "</div>";
  }
}

function telling() {
  const langs = new Set(data.reacties.filter((r) => r.advies === "Langs gaan").map((r) => r.kandidaat));
  const gezien = new Set(data.reacties.map((r) => r.kandidaat));
  const mensen = new Set(data.reacties.map((r) => (r.wie || "").toLowerCase()).filter(Boolean));
  const scenes = new Set((data.planning || []).map((p) => String(p.scene || "").replace(/[A-Za-z]+$/, "")).filter(Boolean)).size;
  document.getElementById("telling").innerHTML =
    "<div><b>" + data.kandidaten.length + "</b><span>opties</span></div>" +
    "<div><b>" + gezien.size + "</b><span>met reactie</span></div>" +
    "<div><b>" + langs.size + "</b><span>langs gaan</span></div>" +
    "<div><b>" + data.decors.length + "</b><span>decors</span></div>" +
    "<div><b>" + scenes + "</b><span>scenes</span></div>" +
    "<div><b>" + mensen.size + "</b><span>mensen</span></div>";
}

const decorNamen = (ids) => ids.map((id) => (data.decors.find((d) => d.id === id) || {}).decor).filter(Boolean);

function teken() {
  const el = document.getElementById("inhoud");
  el.className = "";
  el.innerHTML = tab === "kandidaten" ? tekenVellen() : tab === "decors" ? tekenDecors() : tekenPlanning();
  if (tab === "kandidaten") {
    document.querySelectorAll("details.groep").forEach((g) => g.addEventListener("toggle", () => {
      if (g.open) openGroep(g);
    }));
    knoppen();
  }
}

function groepVan(k) {
  if (!k.decors.length) return "Nog niet gekoppeld aan een decor";
  const d = data.decors.find((x) => x.id === k.decors[0]);
  return d ? (d.hoofd || d.decor) : "Nog niet gekoppeld aan een decor";
}

function tekenVellen() {
  const lijst = data.kandidaten.filter((k) => blok === "alles" || k.blok === blok);
  if (!lijst.length) return '<div class="melding">Geen locaties in dit blok.</div>';

  const mijn = (wieVeld.value || "").toLowerCase();
  const kort = { "Langs gaan": "j", "Twijfel": "t", "Niet nodig": "n" };

  const groepen = {};
  lijst.forEach((k) => {
    const g = groepVan(k);
    (groepen[g] = groepen[g] || []).push(k);
  });

  const namen = Object.keys(groepen).sort((a, b) => {
    if (a.indexOf("Nog niet") === 0) return 1;
    if (b.indexOf("Nog niet") === 0) return -1;
    return a.localeCompare(b, "nl");
  });

  return namen.map((g) => {
    const groep = groepen[g].sort((a, b) => a.naam.localeCompare(b.naam, "nl"));
    const alle = data.reacties.filter((r) => groep.some((k) => k.id === r.kandidaat));
    const telG = (w) => alle.filter((r) => r.advies === w).length;
    const metFoto = groep.filter((k) => k.map !== false).length;

    const vellen = groep.map((k) => {
      const rs = data.reacties.filter((r) => r.kandidaat === k.id);
      const tel = (w) => rs.filter((r) => r.advies === w).length;
      const eigen = rs.filter((r) => (r.wie || "").toLowerCase() === mijn)[0] || { advies: "", opmerking: "" };
      const voor = decorNamen(k.decors);
      const zonderFotos = !!k.link;

      return '<section class="vel" data-kandidaat="' + k.id + '"' + (zonderFotos ? ' data-geenfotos="1"' : "") + ">" +
        '<div class="velkop">' +
          "<h2>" + ontsnap(k.naam) + "</h2>" +

                     : '<div class="vel-fotos"></div>') +
        '<div class="oordeel">' +
          '<div class="keuzes">' +

    const scenes = (data.planning || []).filter((d) => d.decor === g);

      : "";

    return '<details class="groep"><summary><i class="pijl"></i><h2>' + ontsnap(g) + "</h2>" +

function tekenDecors() {
  const lijst = data.decors.filter((d) => {
    if (blok === "alles") return true;
    if (blok === "Nederland") return d.draaitIn === "NL" || d.draaitIn === "NL/AT";
    return d.draaitIn === "AT" || d.draaitIn === "NL/AT";
  });
  lijst.sort((a, b) => {
    const h = String(a.hoofd || a.decor).localeCompare(String(b.hoofd || b.decor), "nl");
    return h || String(a.decor).localeCompare(String(b.decor), "nl");
  });
  let uit = '<div class="tabelwrap"><table><thead><tr><th>Decor</th><th>Int/ext</th><th>Scenes</th>' +
    "<th>Draait in</th><th>Status</th><th>Opties van de scout</th></tr></thead><tbody>";
  let vorig = "";
  lijst.forEach((d) => {
    if (d.hoofd !== vorig) {
      const totaal = lijst.filter((x) => x.hoofd === d.hoofd).reduce((a, x) => a + (x.scenes || 0), 0);
      uit += '<tr class="groepkop"><td colspan="5">' + ontsnap(d.hoofd) + '</td><td class="num">' +
        totaal + " scenes</td></tr>";
      vorig = d.hoofd;
    }
    const kand = data.kandidaten.filter((k) => k.decors.indexOf(d.id) > -1).map((k) => k.naam);
    const kort = d.hoofd && d.decor.indexOf(d.hoofd + " - ") === 0 ? d.decor.slice(d.hoofd.length + 3) : d.decor;
    uit += '<tr><td class="subset">' + ontsnap(kort) + '</td><td class="stil">' + ontsnap(d.intext) +
      '</td><td class="num">' + d.scenes + '</td><td class="stil">' + ontsnap(d.draaitIn) +
      '</td><td class="stil">' + ontsnap(d.status) + "</td><td>" +
      (kand.length ? kand.map(ontsnap).join(", ") : '<span class="stil">&mdash;</span>') + "</td></tr>";
  });
  return uit + "</tbody></table></div>";
}

async function openGroep(groep) {
  if (groep.dataset.geladen) return;
  groep.dataset.geladen = "1";
  const vellen = [...groep.querySelectorAll(".vel[data-kandidaat]")].filter((v) => !v.dataset.geenfotos);
  for (const v of vellen) await laadFotos(v);
}

function kortDatum(d) {
  return d ? new Date(d).toLocaleDateString("nl-NL", { day: "numeric", month: "short" }) : "";
}

function langDatum(d) {
  return d ? new Date(d).toLocaleDateString("nl-NL", { weekday: "short", day: "numeric", month: "short", year: "numeric" }) : "";
}

function sceneTip(s) {
  const kop = [s.intext, s.dagdeel].filter(Boolean).join(" / ") + (s.set ? " \u2014 " + s.set : "");
  const staart = [s.paginas ? s.paginas + " pag." : "", s.figuratie ? s.figuratie + " figuratie" : ""].filter(Boolean).join("  \u00b7  ");
  return kop + "\n" + (s.waarover || "Geen omschrijving") + (staart ? "\n" + staart : "");
}

function sceneChip(s) {
  return '<span class="sc" data-tip="' + ontsnap(sceneTip(s)) + '">' + ontsnap(s.scene) + "</span>";
}

function tekenPlanning() {
  const rijen = data.planning || [];
  if (!rijen.length) return '<div class="melding">Nog geen sc\u00e8neplanning ingelezen.</div>';
  let uit = '<div class="tabelwrap"><table class="planning"><thead><tr><th>Sc\u00e8ne</th><th>I/E</th><th>Dagdeel</th>' +
    "<th>Set</th><th>Waar het over gaat</th><th>Pag.</th><th>Fig.</th></tr></thead><tbody>";
  let vorigeDag = "";
  rijen.forEach((r) => {
    if (r.dag !== vorigeDag) {
      const aant = rijen.filter((x) => x.dag === r.dag).length;
      uit += '<tr class="groepkop"><td colspan="5"><b>' + ontsnap(r.dag || "Nog niet ingepland") + "</b>" +
        (r.datum ? " &middot; " + ontsnap(langDatum(r.datum)) : "") + (r.blok ? " &middot; " + ontsnap(r.blok) : "") + '</td><td colspan="2" class="num">' +
        aant + (aant === 1 ? " sc\u00e8ne" : " sc\u00e8nes") + "</td></tr>";
      vorigeDag = r.dag;
    }
    uit += '<tr><td class="scnr">' + ontsnap(r.scene) + '</td><td class="stil">' + ontsnap(r.intext) +
      '</td><td class="stil">' + ontsnap(r.dagdeel) + "</td><td>" + ontsnap(r.set) + "</td><td>" +
      ontsnap(r.waarover) + '</td><td class="num">' + ontsnap(r.paginas) + '</td><td class="num">' +
      (r.figuratie || "") + "</td></tr>";
  });
  return uit + "</tbody></table></div>";
}

const opener = (src) => () => {
  const dlg = document.getElementById("groot");
  dlg.querySelector("img").src = src;
  dlg.showModal();
};

async function laadFotos(vel) {
  const id = vel.dataset.kandidaat;
  const vak = vel.querySelector(".vel-fotos");
  try {
    if (!fotocache[id]) {
      const r = await fetch(api("actie=fotos&kandidaat=" + id));
      const d = await r.json();
      fotocache[id] = d.fotos || [];
    }
    const fotos = fotocache[id];
    if (!fotos.length) {
      vak.outerHTML = '<p class="geenfoto">Nog geen foto\'s van de scout</p>';
      return;
    }
    const klein = (p) => api("actie=foto&pad=" + encodeURIComponent(p));
    const groot = (p) => api("actie=groot&pad=" + encodeURIComponent(p));
    vak.innerHTML = fotos.map((f) =>
      '<img loading="lazy" alt="" src="' + klein(f.pad) + '" data-groot="' + groot(f.pad) + '">').join("");
    vak.querySelectorAll("img").forEach((img) => img.addEventListener("click", opener(img.dataset.groot)));
  } catch (e) {
    vak.outerHTML = '<p class="geenfoto">Foto\'s niet gelukt</p>';
  }
}

function knoppen() {
  document.querySelectorAll(".keuzes").forEach((rij) => {
    rij.querySelectorAll(".keuze").forEach((b) => b.addEventListener("click", () => {
      rij.querySelectorAll(".keuze").forEach((x) => x.classList.toggle("aan", x === b));
      rij.dataset.gekozen = b.dataset.w;
    }));
  });

  document.querySelectorAll(".bewaar").forEach((knop) => knop.addEventListener("click", async () => {
    const vel = knop.closest(".vel");
    const rij = vel.querySelector(".keuzes");
    const aan = rij.querySelector(".keuze.aan");
    const gekozen = rij.dataset.gekozen || (aan ? aan.dataset.w : "");
    const wie = wieVeld.value.trim();
    if (!wie) { toon("Vul eerst je naam in, rechtsboven."); wieVeld.focus(); return; }
    if (!gekozen) { toon("Kies eerst langs gaan, twijfel of niet nodig."); return; }
    knop.disabled = true; knop.textContent = "Bezig";
    try {
      const r = await fetch(api("actie=reactie"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          kandidaat: vel.dataset.kandidaat,
          wie,
          afdeling: afdVeld.value.trim(),
          advies: gekozen,
          opmerking: vel.querySelector("textarea").value,
        }),
      });
      const d = await r.json();
      if (d.fout) throw new Error(d.fout);
      await haal();
      toon("Bewaard, dank je.");
    } catch (e) {
      toon("Niet gelukt: " + e.message);
    } finally {
      knop.disabled = false; knop.textContent = "Bewaren";
    }
  }));
}

function toon(tekst) {
  const m = document.getElementById("melding");
  m.innerHTML = '<div class="melding">' + ontsnap(tekst) + "</div>";
  window.scrollTo({ top: 0, behavior: "smooth" });
  setTimeout(() => { m.innerHTML = ""; }, 4000);
}

if (!code) {
  document.getElementById("inhoud").innerHTML =
    '<div class="melding">Deze pagina werkt alleen met de volledige link die je van productie hebt gekregen.</div>';
} else {
  haal();
}

      var bezoek = s[7];
      if (bezoek) nr++;
      var label = bezoek ? String(nr) : "·";
      var kleur = bezoek ? "#A4491C" : "#6B7280";
      var icoon = L.divIcon({
        className: "",
        html: '<div style="background:' + kleur + ';color:#fff;width:26px;height:26px;border-radius:50%;display:flex;' +
          'align-items:center;justify-content:center;font:600 12px system-ui;box-shadow:0 1px 4px rgba(0,0,0,.4)">' + label + "</div>",
        iconSize: [26, 26], iconAnchor: [13, 13]
      });
      var m = L.marker([s[5], s[6]], { icon: icoon }).addTo(kaart);
      m.bindPopup("<b>" + ont(s[3] || s[2]) + "</b><br>" + ont(s[1]) + "<br>" + ont(s[4]) +
        '<br><a href="' + maps(s[5] + "," + s[6]) + '" target="_blank" rel="noopener">open in Google Maps</a>');
      punten.push([s[5], s[6]]);
    });
    if (punten.length) kaart.fitBounds(punten, { padding: [30, 30] });
    setTimeout(function () { kaart.invalidateSize(); }, 150);
  }

  function laadKaart() {
    if (window.L) { tekenKaart(); return; }
    if (!document.getElementById("leaflet-css")) {
      var css = document.createElement("link");
      css.id = "leaflet-css"; css.rel = "stylesheet"; css.href = LEAFLET_CSS;
      document.head.appendChild(css);
    }
    var js = document.createElement("script");
    js.src = LEAFLET_JS;
    js.onload = tekenKaart;
    js.onerror = function () {
      var vak = document.getElementById("tourkaart");
      if (vak) vak.innerHTML = '<p class="planregel" style="padding:16px">De kaart kon niet laden. De adressen en de Google Maps-knoppen hieronder werken wel.</p>';
    };
    document.head.appendChild(js);
  }

  function stijl() {
    if (document.getElementById("tourstijl")) return;
    var s = document.createElement("style");
    s.id = "tourstijl";
    s.textContent =
      ".tourstop{padding:10px 0 2px;border-top:1px solid var(--lijn);margin-top:10px}" +
      '.tourstop[data-bezoek="1"]{border-left:3px solid var(--accent);padding-left:12px;border-top-left-radius:8px}' +
      ".tourkop{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}" +
      ".tourtijd{font:500 12.5px var(--mono);color:var(--zacht);min-width:92px;white-space:nowrap}" +
      '.tourstop[data-bezoek="1"] .tourtijd{color:var(--accent)}' +
      ".touradres{font:400 12px var(--mono);color:var(--zacht2)}" +
      ".touropties{margin-top:10px}" +
      ".touropties .vel{margin-bottom:10px}" +
      "@media(max-width:560px){.tourkop{gap:4px}.tourtijd{min-width:0}}";
    document.head.appendChild(s);
  }

  function start() {
    var rij = document.querySelector(".pillen");
    var inhoud = document.getElementById("inhoud");
    if (!rij || !inhoud) return;
    if (rij.querySelector("[data-tour]")) return;
    stijl();

    var knop = document.createElement("button");
    knop.type = "button";
    knop.className = "pil";
    knop.setAttribute("data-tour", "1");
    knop.textContent = "Locatiebezoek Oostenrijk";
    rij.appendChild(knop);

    knop.addEventListener("click", function (e) {
      e.stopPropagation();
      var pillen = rij.querySelectorAll(".pil");
      for (var i = 0; i < pillen.length; i++) pillen[i].classList.remove("aan");
      knop.classList.add("aan");
      inhoud.className = "";
      inhoud.innerHTML = bouw();
      vulOpties(inhoud);
      laadKaart();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }, true);

    rij.addEventListener("click", function (e) {
      var p = e.target.closest ? e.target.closest(".pil") : null;
      if (p && p !== knop) { knop.classList.remove("aan"); kaart = null; }
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();

</script>
</body>
</html>
