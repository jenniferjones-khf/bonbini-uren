# Netlify-instellingen voor het urenportaal van Bon Bini.
# Twee pagina's, index.html voor de uren en gegevens.html voor de persoonsgegevens,
# plus een serverfunctie die met Airtable praat.

[build]
  publish = "."
  functions = "netlify/functions"
  command = ""

# De functie zet zijn eigen pad via `export const config = { path: "/api/portaal" }`.
# Deze redirect staat er als vangnet voor het geval dat pad ooit wegvalt.
[[redirects]]
  from = "/api/portaal"
  to = "/.netlify/functions/portaal"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

# De pagina bevat persoonlijke gegevens; niet laten cachen door tussenliggende servers.
[[redirects]]
  from = "/gegevens"
  to = "/gegevens.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/gegevens.html"
  [headers.values]
    Cache-Control = "no-store"

# De locatiepagina: kandidaten van de scout, de decors uit de locatielijst, en de
# reacties van de heads. De foto's komen live uit Dropbox via /api/locaties.
[[redirects]]
  from = "/locaties"
  to = "/locaties.html"
  status = 200

[[headers]]
  for = "/locaties.html"
  [headers.values]
    Cache-Control = "no-store"
